name: expenses_management_app
description: "A private, offline-first personal expense tracker with optional budget cycles and shopping planning."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Data layer
  drift: ^2.34.0
  sqlite3: ^3.5.0
  path_provider: ^2.1.5
  path: ^1.9.1

  # Application / state
  flutter_riverpod: ^3.4.3

  # Utilities
  uuid: ^4.5.1
  intl: ^0.20.2
  clock: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Drift code generation
  drift_dev: ^2.34.0
  build_runner: ^2.7.0

  # App icon generation (sources: favicon_io/)
  flutter_launcher_icons: ^0.14.0

flutter_launcher_icons:
  image_path: "favicon_io/android-chrome-512x512.png"
  android: true
  min_sdk_android: 21
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "favicon_io/favicon-32x32.png"
    background_color: "#FFFFFF"
    theme_color: "#009688"
  windows:
    generate: true
    image_path: "favicon_io/android-chrome-512x512.png"
    icon_size: 48
  macos:
    generate: true

flutter:
  uses-material-design: true
  generate: true
  assets:
    - favicon_io/android-chrome-192x192.png
